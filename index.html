<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>F‑STATIC — Faster Than NGINX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #000;
        color: #eee;
        font-family: Arial, sans-serif;
        overflow-x: hidden;
    }

    /* NAVBAR */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .navbar .logo {
        font-size: 28px;
        font-weight: bold;
        background: linear-gradient(90deg, #00eaff, #00ffaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .navbar ul {
        list-style: none;
        display: flex;
        gap: 25px;
        padding: 0;
        margin: 0;
    }

    .navbar a {
        color: #00eaff;
        text-decoration: none;
        font-weight: bold;
        transition: 0.2s;
    }

    .navbar a:hover {
        color: #00ffaa;
    }

    /* CONTENT */
    #content {
        padding: 40px;
        max-width: 900px;
        margin: auto;
        transition: opacity 0.25s ease;
    }

    h1 {
        font-size: 50px;
        background: linear-gradient(90deg, #00eaff, #00ffaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    h2 {
        font-weight: 300;
        color: #bbb;
        margin-top: 0;
    }

    .card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 25px;
        margin: 20px 0;
        backdrop-filter: blur(6px);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-4px);
        border-color: #00eaff;
    }

    .highlight {
        color: #00eaff;
        font-weight: bold;
    }

    /* GLOW EFFECT */
    .glow {
        position: fixed;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(0,255,255,0.25), transparent 70%);
        pointer-events: none;
        transform: translate(-50%, -50%);
        filter: blur(40px);
        z-index: 0;
    }
</style>
</head>

<body>

<div class="glow"></div>

<nav class="navbar">
    <div class="logo">F‑STATIC</div>
    <ul>
        <li><a href="#" onclick="loadPage('home')">Home</a></li>
        <li><a href="#" onclick="loadPage('benchmarks')">Benchmarks</a></li>
        <li><a href="#" onclick="loadPage('docs')">Docs</a></li>
        <li><a href="#" onclick="loadPage('download')">Download</a></li>
        <li><a href="#" onclick="loadPage('about')">About</a></li>
    </ul>
</nav>

<div id="content"></div>

<script>
/* PAGE CONTENTS */
const pages = {
    home: `
        <h1>F‑STATIC</h1>
        <h2>The Fastest Static File Server Ever Built</h2>

        <div class="card">
            <h3>Why We Beat NGINX</h3>
            <p>NGINX is a <span class="highlight">general‑purpose web server</span> with layers of modules and filters.</p>
            <p>F‑STATIC is a <span class="highlight">pure static‑file railgun</span> built for one job:</p>
            <p><strong>Serve files at maximum physical speed.</strong></p>
        </div>

        <div class="card">
            <h3>Zero‑Overhead Architecture</h3>
            <p>Direct <span class="highlight">memory → socket</span> pipeline. No bloat.</p>
        </div>

        <div class="card">
            <h3>GPU‑Pinned Memory</h3>
            <p>Ultra‑fast DMA transfers. NGINX can’t do this.</p>
        </div>

        <div class="card">
            <h3>SO_REUSEPORT Scaling</h3>
            <p>Every CPU core gets its own worker. No lock contention.</p>
        </div>

        <div class="card">
            <h3>The Result?</h3>
            <p><strong>100k–200k requests/sec</strong> on mid‑range hardware.</p>
        </div>
    `,

    benchmarks: `
        <h1>Benchmarks</h1>
        <div class="card">
            <p>F‑STATIC reaches <strong>100k–200k RPS</strong> on mid‑range hardware.</p>
            <p>NGINX cannot match this for pure static files.</p>
        </div>
    `,

    docs: `
        <h1>Documentation</h1>
        <div class="card"><p>How to run F‑STATIC</p></div>
        <div class="card"><p>GPU pinned memory</p></div>
        <div class="card"><p>Workers & SO_REUSEPORT</p></div>
        <div class="card"><p>VRAM promotion</p></div>
    `,

    download: `
        <h1>Download</h1>
        <div class="card"><p>Linux x64 — Coming soon</p></div>
        <div class="card"><p>Windows — Coming soon</p></div>
        <div class="card"><p>Source code available on GitHub</p></div>
    `,

    about: `
        <h1>About F‑STATIC</h1>
        <div class="card">
            <p>A static file server engineered for maximum speed.</p>
            <p>Built with GPU‑pinned memory, epoll, and multi‑process scaling.</p>
        </div>
    `
};

/* PAGE LOADER */
function loadPage(name) {
    const container = document.getElementById("content");
    container.style.opacity = 0;

    setTimeout(() => {
        container.innerHTML = pages[name];
        container.style.opacity = 1;
    }, 200);
}

/* DEFAULT PAGE */
loadPage('home');

/* GLOW EFFECT */
document.addEventListener("mousemove", e => {
    const glow = document.querySelector(".glow");
    glow.style.left = e.pageX + "px";
    glow.style.top = e.pageY + "px";
});
</script>

</body>
</html>
